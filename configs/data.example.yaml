# Example data config for multi-task fine-tuning with the task mix of our run;
# the options are described in the README ("2.1 Data").

image:
  datasets:
    my_i2i:
      task: i2i
      path: /path/to/my_i2i
      prob: 0.2
    my_ti_i2i:
      task: ti_i2i
      path: hf://datasets/your-name/your-repo
      prob: 0.2
      format: tar
      shards: "data/*.tar"
      keys: {target: edited.jpg, reference: ref.jpg}

video:
  num_frames: 65
  frame_sampling: random_clip
  datasets:
    my_v2v:
      task: v2v
      path: /path/to/my_v2v
      prob: 0.2
    my_tiv2v:
      task: tiv2v
      path: /path/to/my_tiv2v
      prob: 0.2

3d:
  num_views: 26
  datasets:
    my_3d:
      path: hf://datasets/your-name/your-3d-repo
      prob: 0.2
      keys: {source: original.mp4, target: edited.mp4}
