# Example data config for geometry post-training with the task mix of our run;
# the options are described in the README ("2.1 Data").

image:
  datasets:
    my_i2i:
      task: i2i
      path: /path/to/my_i2i
      prob: 0.15
    my_ti_i2i:
      task: ti_i2i
      path: /path/to/my_ti_i2i
      prob: 0.15

video:
  num_frames: 65
  datasets:
    my_v2v:
      task: v2v
      path: /path/to/my_v2v
      prob: 0.15
    my_tiv2v:
      task: tiv2v
      path: /path/to/my_tiv2v
      prob: 0.15

3d:
  num_views: 17
  datasets:
    my_3d:
      path: /path/to/my_3d
      prob: 0.4
